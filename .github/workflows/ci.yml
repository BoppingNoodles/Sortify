name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR makes its older run obsolete. Runs on main pushes
# are never cancelled, so every merged commit gets a CI result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-lint:
    name: Python Lint & Format (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff==0.17.6  # keep in sync with requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      # CI has no GPU; the CPU wheels skip several GB of CUDA libraries.
      - name: Install dependencies
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: pip install -r requirements.txt

      - name: Run backend test suite
        run: pytest backend/tests -q

  ml-tests:
    name: ML Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
            ml/requirements-onnx.txt

      - name: Install dependencies
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: pip install -r requirements.txt -r ml/requirements-onnx.txt

      - name: Run ML test suite
        run: pytest ml/tests -q

  backend-docker:
    name: Backend Docker Build & Boot
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Render builds this exact Dockerfile from the repo root on deploy.
      - name: Build image
        run: docker build -f backend/Dockerfile -t sortify-backend:ci .

      # A missing or unreadable checkpoint does not crash the app; it silently
      # falls back to no-model mode, so /health alone cannot catch it.
      - name: Report image size
        run: docker image ls sortify-backend:ci --format 'sortify-backend:ci {{.Size}}'

      - name: Verify model loads inside the image
        run: |
          docker run --rm sortify-backend:ci python -c '
          import torch
          assert torch.version.cuda is None, f"CUDA torch in image: {torch.__version__}"
          print(f"torch {torch.__version__} (CPU-only)")
          from backend.app.services.inference import ModelService
          s = ModelService()
          assert s.model is not None, f"model not loaded from {s.model_path}"
          print(f"Model loaded from {s.model_path}: {len(s.class_names)} classes")
          '

      - name: Boot container and hit /health
        run: |
          docker run -d --name sortify -p 8000:8000 sortify-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo
              echo "Backend container is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Backend container never became healthy. Logs:"
          docker logs sortify
          exit 1

  frontend-check:
    name: Frontend Lint, Tests & Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Offline mode checks against the version table bundled with the
      # installed expo package, so the result only changes when the lockfile
      # does, not whenever Expo publishes a patch release.
      - name: Check native packages match the Expo SDK
        env:
          CI: 1
          EXPO_OFFLINE: 1
        run: npx expo install --check

      - name: Syntax check
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The syntax check parses files one at a time; only a real Metro bundle
      # catches unresolved imports and missing modules.
      - name: Bundle app (Android + iOS)
        env:
          CI: 1
          EXPO_OFFLINE: 1
        run: npx expo export --platform android --platform ios --output-dir dist
