# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"

# Tone and review persona instructions (max 250 characters)
tone_instructions: >-
  Supportive mentor for student devs. Focus strictly on real bugs, security
  flaws, missing error handling, and logic errors. Explain suggestions simply
  with clean examples; avoid minor style nitpicks.

reviews:
  # "chill" focuses on high-impact issues and critical bugs rather than pedantic style comments
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  # Ignore files where automated reviews are not helpful
  path_filters:
    - "!**/*.json"
    - "!**/*.md"
    - "!data/**"

chat:
  auto_reply: true
